name: Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            vendor/ts-pattern/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1 }
      - name: Install plugin npm dependencies
        working-directory: plugin
        run: npm ci
      - name: Rust unit tests
        run: cargo test --manifest-path plugin/Cargo.toml
      - name: Build SWC plugin wasm
        run: cargo build --manifest-path plugin/Cargo.toml --release --target wasm32-wasip1
      - name: Web check
        working-directory: web
        run: deno task check
      - name: Web tests
        working-directory: web
        run: deno task test
      - name: Example type checks
        working-directory: examples
        run: deno task check
      - name: Install vendored ts-pattern npm dependencies
        working-directory: vendor/ts-pattern
        run: npm ci
      - name: Vendored ts-pattern SWC transform tests
        run: deno run -A --unstable-detect-cjs scripts/check-vendored-ts-pattern-swc.ts
      - name: Vendored ts-pattern tests
        working-directory: vendor/ts-pattern
        run: npm test
      - name: npm package dry run
        working-directory: plugin
        run: npm pack --dry-run
      - name: JSR publish dry run
        working-directory: plugin
        run: deno publish --dry-run

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1 }
      - name: Verify release tag matches package versions
        run: |
          PKG_VERSION="$(node -p "require('./plugin/package.json').version")"
          JSR_VERSION="$(node -p "require('./plugin/deno.json').version")"
          test "$PKG_VERSION" = "$JSR_VERSION"
          test "refs/tags/v$PKG_VERSION" = "$GITHUB_REF"
      - name: Install npm dependencies
        working-directory: plugin
        run: npm ci
      - name: Build SWC plugin wasm
        run: cargo build --manifest-path plugin/Cargo.toml --release --target wasm32-wasip1
      - name: Publish to npm
        working-directory: plugin
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: npm publish --provenance --access public
      - name: Publish to JSR
        working-directory: plugin
        run: deno publish
