name: Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            vendor/ts-pattern/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1 }
      - name: Install plugin npm dependencies
        working-directory: plugin
        run: npm ci
      - name: Rust unit tests
        run: cargo test --manifest-path plugin/Cargo.toml
      - name: Build SWC plugin wasm
        working-directory: plugin
        run: npm run build
      - name: Web check
        working-directory: web
        run: deno task check
      - name: Web tests
        working-directory: web
        run: deno task test
      - name: Example type checks
        working-directory: examples
        run: deno task check
      - name: Install vendored ts-pattern npm dependencies
        working-directory: vendor/ts-pattern
        run: npm ci
      - name: Vendored ts-pattern SWC transform tests
        run: deno run -A --unstable-detect-cjs scripts/check-vendored-ts-pattern-swc.ts
      - name: Vendored ts-pattern tests
        working-directory: vendor/ts-pattern
        run: npm test
      - name: JSR publish dry run
        working-directory: plugin
        run: deno publish --dry-run

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1 }
      - name: Verify release tag matches JSR package version
        run: |
          JSR_VERSION="$(deno eval "const config = JSON.parse(await Deno.readTextFile('./plugin/deno.json')); console.log(config.version)")"
          test "refs/tags/v$JSR_VERSION" = "$GITHUB_REF"
      - name: Build SWC plugin wasm
        run: |
          cargo build --manifest-path plugin/Cargo.toml --release --target wasm32-wasip1
          cp plugin/target/wasm32-wasip1/release/ts_pattern_swc_plugin.wasm plugin/target/wasm32-wasip1/release/ts_pattern_swc_plugin.wasm.bin
      - name: Publish to JSR
        working-directory: plugin
        run: deno publish
